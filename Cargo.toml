[package]
name = "hammer-editor-mcp-server"
version = "0.1.0"
edition = "2021"
description = "MCP server for interacting with Hammer Editor's synchronization API"
license = "MIT"
repository = "https://github.com/XavierTolza/hammer-editor-mcp-server"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
flate2 = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
assert-json-diff = "2"
