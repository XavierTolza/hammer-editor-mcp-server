name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Tag name: from tag push (github.ref_name) or from manual input (v + version)
  RELEASE_TAG: ${{ github.ref_name == '' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  # ── Create Tag (manual only) ────────────────────────────────────
  tag:
    name: Create Tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          if ! echo "${{ inputs.version }}" | grep -P '^\d+\.\d+\.\d+$'; then
            echo "❌ Invalid version: '${{ inputs.version }}'. Must be semver like 0.2.0"
            exit 1
          fi

      - name: Create and push tag
        run: |
          TAG="v${{ inputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "✅ Tag $TAG created"

  # ── Build Matrix ────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.tag.outputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare asset
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && needs.tag.outputs.tag || github.ref_name }}"
          ASSET="hammer-editor-mcp-server-${TAG}-${{ matrix.target }}${{ matrix.suffix }}"
          cp "target/${{ matrix.target }}/release/hammer-editor-mcp-server${{ matrix.suffix }}" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: hammer-editor-mcp-server-*-${{ matrix.target }}${{ matrix.suffix }}

  # ── Create Release ──────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.tag.outputs.tag || github.ref_name }}

      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: List assets
        run: ls -lh artifacts/

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && needs.tag.outputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && needs.tag.outputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
